name: Playground

# Publishes the playground (playground/README.md) to GitHub Pages on each push to main. Pages
# must be on, with GitHub Actions as its source (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: read lets the job pull the dev container image from GHCR.
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The dev container builds the page (ADR 0032).
      - uses: ./.github/actions/devcontainer
        with:
          run: |
            uv run --project tools --locked tools/playground.py
            (cd playground && npm ci && npm run build)
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground/dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
