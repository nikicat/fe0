name: CI

on:
  push:
  pull_request:

# packages: write lets pushes to main store the dev container image in GHCR.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The checks run in the dev container, so its Containerfile is the one place that pins
      # Fe and the other tools. The image is cached in GHCR. Only pushes to main update it.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          runCmd: |
            set -e
            echo "::group::fe --version"
            fe --version
            echo "::endgroup::"
            echo "::group::tools types"
            # The tools run in their own uv environment (tools/pyproject.toml, tools/uv.lock).
            (cd tools && uv sync --locked && uv run --locked mypy && uv run --locked pyright)
            echo "::endgroup::"
            # The generated test files must match their generators, so a hand edit fails here.
            echo "::group::generated tests"
            uv run --project tools --locked tools/gen_check_tests.py
            uv run --project tools --locked tools/gen_codegen_tests.py
            git diff --exit-code -- fe0/src/check_tests.fe fe0/src/codegen_tests.fe
            echo "::endgroup::"
            # CI skips the spike-*/ probes, because several of their tests fail on purpose to
            # report values. tools/spikes.sh runs them.
            echo "::group::fe0"
            (cd fe0 && fe fmt --check && fe test)
            echo "::endgroup::"
            echo "::group::fe0-cli format"
            (cd fe0-cli && fe fmt --check)
            echo "::endgroup::"
            echo "::group::corpus"
            uv run --project tools --locked tools/embed.py
            echo "::endgroup::"
            # Fixed seeds, see DESIGN.md §11.
            echo "::group::generated programs"
            uv run --project tools --locked tools/gen.py -n 25
            echo "::endgroup::"
            # DESIGN.md §10. It runs after the generated programs, so it checks those too.
            echo "::group::native CLI"
            uv run --project tools --locked tools/cli_check.py
            echo "::endgroup::"
            # ADR 0016, step 0: senders, logs and storage writes, on anvil. Like the native CLI
            # check, it covers the generated programs too.
            echo "::group::programs on a node"
            uv run --project tools --locked tools/node_check.py
            echo "::endgroup::"
