name: CI

on:
  push:
  pull_request:

# packages: write lets pushes to main store the dev container image in GHCR.
permissions:
  contents: read
  packages: write

jobs:
  # The groups run in parallel, each in its own dev container, so no group may read what
  # another writes.
  test:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: fe0 and corpus
            # One job updates the cached image, so that the jobs do not race to push it.
            push: filter
            run: |
              fe --version
              # The tools run in their own uv environment (tools/pyproject.toml, tools/uv.lock).
              (cd tools && uv sync --locked && uv run --locked mypy && uv run --locked pyright)
              # The generated test files must match their generators, so a hand edit fails here.
              uv run --project tools --locked tools/gen_check_tests.py
              uv run --project tools --locked tools/gen_codegen_tests.py
              git diff --exit-code -- fe0/src/check_tests.fe fe0/src/codegen_tests.fe
              # CI skips the spike-*/ probes, because several of their tests fail on purpose
              # to report values. tools/spikes.sh runs them.
              (cd fe0 && fe fmt --check && fe test)
              (cd fe0-cli && fe fmt --check)
              uv run --project tools --locked tools/embed.py
          - group: generated programs
            run: |
              # The seeds are fixed (DESIGN.md §11).
              uv run --project tools --locked tools/gen.py -n 25
              # The native CLI check (DESIGN.md §10) and the node check run after gen.py, so
              # they check the generated programs too.
              uv run --project tools --locked tools/cli_check.py
              # The node check compares senders, logs and storage writes on anvil (ADR 0016).
              uv run --project tools --locked tools/node_check.py
          - group: mutants
            run: |
              # The mutants check gives Fe one-mutation changes of the corpus and of generated
              # programs (DESIGN.md §11a).
              uv run --project tools --locked tools/mutate.py --seed 100 -n 30 --per-program 4
          - group: on chain
            run: |
              # The chain check runs the phase contracts and Compiler on anvil and compares
              # their output with the native CLI's (DESIGN.md §8).
              (cd fe0-chain && fe fmt --check)
              uv run --project tools --locked tools/chain_check.py
              # registry/README.md, "Build and check", says what the registry check checks.
              (cd registry && fe fmt --check)
              uv run --project tools --locked tools/registry_check.py
          - group: playground
            run: |
              # playground/README.md, "Tests", says what these tests check.
              uv run --project tools --locked tools/playground.py
              (cd playground && npm ci && npm test && CI=1 npm run e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/devcontainer
        with:
          push: ${{ matrix.push }}
          run: ${{ matrix.run }}
