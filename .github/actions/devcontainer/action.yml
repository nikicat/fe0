name: Dev container
description: Runs a command in the dev container, whose image is cached in GHCR.
inputs:
  run:
    description: The shell command to run. It stops at the first failing line.
    required: true
  push:
    description: >-
      When to update the cached image, as devcontainers/ci's push input. Never if empty.
runs:
  using: composite
  steps:
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # The dev container pins Fe and the other tools (ADR 0022).
    - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:
        imageName: ghcr.io/${{ github.repository }}/devcontainer
        cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
        push: ${{ inputs.push || 'never' }}
        refFilterForPush: refs/heads/main
        eventFilterForPush: push
        runCmd: |
          set -e
          ${{ inputs.run }}
